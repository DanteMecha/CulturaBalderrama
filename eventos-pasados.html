<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: 140px; }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }
  .page-head p{
    margin-top: 18px;
    max-width: 480px;
    color: var(--dim);
    line-height: 1.7;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gutter);
  }
  .grid.wide{
    grid-template-columns: repeat(3, 1fr);
  }
  .cell{
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0a0a0a;
  }
  .cell.clickable{
    cursor: pointer;
    aspect-ratio: 4/5;
  }
  .cell.clickable .play{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: background 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
  }
  .cell.clickable:hover .play{
    background: var(--white);
    transform: translate(-50%,-50%) scale(1.08);
    opacity: 1;
  }
  .cell.clickable .play::after{
    content: '';
    width: 0; height: 0;
    border-style: solid;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent var(--white);
    margin-left: 3px;
    transition: border-color 0.3s ease;
  }
  .cell.clickable:hover .play::after{
    border-color: transparent transparent transparent #000;
  }
  .cell img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%);
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  .cell:hover img{
    transform: scale(1.03);
    filter: grayscale(0%);
  }
  .cell .caption{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%);
  }
  .caption .title{ font-weight: 500; font-size: 1rem; }
  .caption .sub{
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--dim);
    margin-top: 2px;
  }

  site-footer{ display: block; margin-top: 80px; }

  @media (max-width: 700px){
    .grid, .grid.wide{ grid-template-columns: 1fr; }
    .page-head{ padding: 0 20px 40px; }
  }

  .modal{
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .modal.open{
    opacity: 1;
    pointer-events: auto;
  }
  .modal .frame{
    position: relative;
    width: min(1080px, 100%);
    background: #000;
  }
  .modal .ratio{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
  }
  .modal iframe{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .modal .close{
    position: absolute;
    top: -56px;
    right: 0;
    background: none;
    border: none;
    color: var(--white);
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 2px;
    cursor: pointer;
    padding: 8px;
  }
  .modal .close:hover{ color: var(--dim); }
</style>
</head>
<body data-page="eventosPasados">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.eventosPasados.heading"></h1>
    <p data-text="pages.eventosPasados.description"></p>
  </section>
  <section class="grid" id="work">
    <div class="cell clickable" data-video="https://www.youtube.com/embed/8yaWGfB849k?start=1216&autoplay=1">
      <img src="images/Flyer_Lucrecia_Martel.jpg" alt="">
      <span class="play"></span>
      <div class="caption">
        <div class="title" data-text="pages.eventosPasados.items.0.title"></div>
        <div class="sub" data-text="pages.eventosPasados.items.0.sub"></div>
      </div>
    </div>
    <div class="cell clickable" data-video="https://www.youtube.com/embed/8yaWGfB849k?start=1216&autoplay=1">
      <img src="images/flyer_Marttein_2.jpg" alt="">
      <span class="play"></span>
      <div class="caption">
        <div class="title" data-text="pages.eventosPasados.items.1.title"></div>
        <div class="sub" data-text="pages.eventosPasados.items.1.sub"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="videoModal">
  <button class="close" id="videoClose" data-text="pages.eventosPasados.closeLabel"></button>
  <div class="frame">
    <div class="ratio">
      <iframe id="videoFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>
</div>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>
<script>
  const modal = document.getElementById('videoModal');
  const frame = document.getElementById('videoFrame');
  const closeBtn = document.getElementById('videoClose');
  document.querySelectorAll('.cell.clickable').forEach(cell => {
    cell.addEventListener('click', () => {
      frame.src = cell.dataset.video;
      modal.classList.add('open');
    });
  });
  const closeModal = () => {
    modal.classList.remove('open');
    frame.src = '';
  };
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
