<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: 140px; }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }
  .page-head p{
    margin-top: 18px;
    max-width: 480px;
    color: var(--dim);
    line-height: 1.7;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gutter);
  }
  .grid.wide{
    grid-template-columns: repeat(3, 1fr);
  }
  .cell{
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0a0a0a;
  }
  .cell img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%);
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  .cell:hover img{
    transform: scale(1.03);
    filter: grayscale(0%);
  }
  .cell .caption{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%);
  }
  .caption .title{ font-weight: 500; font-size: 1rem; }
  .caption .sub{
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--dim);
    margin-top: 2px;
  }

  site-footer{ display: block; margin-top: 80px; }

  @media (max-width: 700px){
    .grid, .grid.wide{ grid-template-columns: 1fr; }
    .page-head{ padding: 0 20px 40px; }
  }
</style>
</head>
<body data-page="eventosProximos">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.eventosProximos.heading"></h1>
    <p data-text="pages.eventosProximos.description"></p>
  </section>
  <section class="grid" id="work">
    <div class="cell">
      <img src="images/Flyer_Lucrecia_Martel.jpg" alt="">
      <div class="caption">
        <div class="title" data-text="pages.eventosProximos.items.0.title"></div>
        <div class="sub" data-text="shared.upcoming"></div>
      </div>
    </div>
    <div class="cell">
      <img src="images/Flyer_Marttein.jpg" alt="">
      <div class="caption">
        <div class="title" data-text="pages.eventosProximos.items.1.title"></div>
        <div class="sub" data-text="shared.upcoming"></div>
      </div>
    </div>
    <div class="cell">
      <img src="images/Banner_2.jpg" alt="">
      <div class="caption">
        <div class="title" data-text="pages.eventosProximos.items.2.title"></div>
        <div class="sub" data-text="shared.upcoming"></div>
      </div>
    </div>
  </section>
</main>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
