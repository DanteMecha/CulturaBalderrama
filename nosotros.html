<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: 140px; }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  /* ---------- about ---------- */
  .about{
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 40px 80px;
  }
  .about-block{
    display: flex;
    gap: 28px;
    padding: 44px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .about-block:last-child{
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .about-block .num{
    font-family: var(--font-body);
    font-weight: 900;
    text-transform: uppercase;
    color: #D6E6F2;
    letter-spacing: 0.05em;
    font-size: clamp(1.1rem, 2vw, 1.4rem);
    line-height: 1.1;
    flex-shrink: 0;
  }
  .about-content h2{
    font-family: var(--font-brand);
    font-weight: 900;
    text-transform: uppercase;
    color: #D6E6F2;
    letter-spacing: 0.04em;
    font-size: clamp(1.5rem, 3.5vw, 2.4rem);
    line-height: 1.05;
    margin-bottom: 22px;
  }
  .about-content p{
    color: #FFFFFF;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .about-content .highlight{
    color: #DDB043;
    font-weight: bold;
  }
  .about-content .quote{
    color: #DDB043;
    font-style: italic;
    font-family: var(--font-body);
    font-size: 1.2rem;
  }

  @media (max-width: 700px){
    .page-head{ padding: 0 20px 0; }
    .about{ padding: 30px 20px 60px; }
    .about-block{ flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body data-page="nosotros">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.nosotros.heading"></h1>
  </section>
  <section class="about">
    <article class="about-block">
      <div class="num" data-text="pages.nosotros.blocks.0.num"></div>
      <div class="about-content">
        <h2 data-text="pages.nosotros.blocks.0.heading"></h2>
        <p data-text="pages.nosotros.blocks.0.content.0"></p>
        <p data-text="pages.nosotros.blocks.0.content.1"></p>
        <p class="quote" data-text="pages.nosotros.blocks.0.content.2"></p>
        <p data-text="pages.nosotros.blocks.0.content.3"></p>
      </div>
    </article>
    <article class="about-block">
      <div class="num" data-text="pages.nosotros.blocks.1.num"></div>
      <div class="about-content">
        <h2 data-text="pages.nosotros.blocks.1.heading"></h2>
        <p data-html="pages.nosotros.blocks.1.content.0"></p>
      </div>
    </article>
    <article class="about-block">
      <div class="num" data-text="pages.nosotros.blocks.2.num"></div>
      <div class="about-content">
        <h2 data-text="pages.nosotros.blocks.2.heading"></h2>
        <p data-html="pages.nosotros.blocks.2.content.0"></p>
      </div>
    </article>
  </section>
</main>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
