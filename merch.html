<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f2f1ed;
    --gold: #e8ca22;
    --celeste: #9EC5EC;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }
  em{ font-style: normal; font-weight: 500; color: var(--white); }

  main{ padding-top: calc(var(--header-h, 148px) + 8px); }

  .page-head{ padding: 0 40px; }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--white);
  }

  .slide{
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    align-items: stretch;
    margin-top: 90px;
  }

  .slide-text{ padding: 48px 48px 56px; }

  .kicker{
    display: flex;
    align-items: baseline;
    gap: 16px;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--celeste);
    margin-bottom: 18px;
  }
  .kicker .place{ color: var(--dim); letter-spacing: 1.5px; }

  .event-content h2{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--white);
    margin-bottom: 28px;
    margin-top: 0;
  }

  .event-content p{
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 16px;
    color: rgba(242,241,237,0.72);
    max-width: 62ch;
  }
  .event-content p:last-child{ margin-bottom: 0; }

  .highlight-gold { color: var(--gold); }
  .highlight-celeste { color: var(--celeste); }

  .gallery{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    align-content: start;
    gap: var(--gutter);
  }
  .gallery .cell{
    position: relative;
    aspect-ratio: 1/1;
    overflow: hidden;
    background: #0a0a0a;
  }
  .gallery .cell img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%);
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  @media (hover: hover) and (pointer: fine){
    .gallery .cell:hover img{
      transform: scale(1.03);
      filter: grayscale(0%);
    }
  }
  @media (hover: none){
    .gallery .cell:active img{
      transform: scale(1.03);
      filter: grayscale(0%);
    }
  }

  site-footer{ display: block; margin-top: 80px; }

  @media (max-width: 700px){
    .page-head{ padding: 0 20px; }
    .slide{ grid-template-columns: 1fr; margin-top: 56px; }
    .slide-text{ padding: 32px 20px 40px; }
    .event-content h2{ margin-bottom: 20px; }
  }

  /* Tablet */
  @media (min-width: 701px) and (max-width: 900px){
    .page-head{ padding: 0 28px; }
    .slide{ grid-template-columns: 1fr; }
    .slide-text{ padding: 40px 28px 48px; }
  }
</style>
</head>
<body data-page="merch">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.merch.heading"></h1>
  </section>

  <article class="slide" data-side="left" id="remeras">
    <div class="slide-text">
      <article class="event-block">
        <div class="event-content">
          <div class="kicker">
            <span data-text="pages.merch.sections.0.kicker"></span>
            <span class="place" data-text="pages.merch.sections.0.meta"></span>
          </div>
          <h2 data-text="pages.merch.sections.0.title"></h2>
          <p data-html="pages.merch.sections.0.content.0"></p>
        </div>
      </article>
    </div>
    <div class="gallery">
      <div class="cell">
        <img src="images/Logo_negro_sobre_blaco.jpg" alt="Remera Balderrama — Logo negro" loading="lazy" decoding="async">
      </div>
      <div class="cell">
        <img src="images/Logo_celeste_sobre_blanco.jpg" alt="Remera Balderrama — Logo celeste" loading="lazy" decoding="async">
      </div>
      <div class="cell">
        <img src="images/Logo_largo_celeste_sobre_blanco.jpg" alt="Remera Balderrama — Logo largo celeste" loading="lazy" decoding="async">
      </div>
      <div class="cell">
        <img src="images/Logo_largo_negro_sobre_blanco.jpg" alt="Remera Balderrama — Logo largo negro" loading="lazy" decoding="async">
      </div>
    </div>
  </article>
</main>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
