<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --celeste: #9EC5EC;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: calc(var(--header-h, 140px) + 8px); }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  /* ---------- contacto ---------- */
  .contact{
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 40px 90px;
  }
  .contact-row{
    display: flex;
    gap: 28px;
    padding: 40px 0;
    border-top: 1px solid rgb(255, 255, 255);
  }
  .contact-row:last-child{
    border-bottom: 1px solid rgb(255, 255, 255);
  }
  .contact-row .label{
    flex: 0 0 150px;
    padding-top: 8px;
    font-family: var(--font-body);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 0.72rem;
    color: var(--celeste);
  }
  .contact-row .value{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(1.8rem, 4.5vw, 3.2rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--dim);
    transition: color 0.3s ease, transform 0.4s ease;
  }
  a.value{ display: inline-block; }
  a.value:focus-visible{
    color: var(--white);
    transform: translateX(10px);
  }

  /* Nombre de la app por defecto; al hacer hover se revela la cuenta. */
  a.value.value-swap{
    display: inline-grid;
  }
  .value-swap .value-default,
  .value-swap .value-hover{
    grid-area: 1 / 1;
    transition: opacity 0.25s ease;
  }
  .value-swap .value-hover{
    color: var(--celeste);
    opacity: 0;
    pointer-events: none;
    overflow-wrap: anywhere;
  }
  .value-swap:focus-visible .value-default{
    opacity: 0;
  }
  .value-swap:focus-visible .value-hover{
    opacity: 1;
  }

  /* El hover solo con cursor real: en touch queda pegado tras el tap. */
  @media (hover: hover) and (pointer: fine){
    a.value:hover,
    .contact-row .value.is-static:hover{
      color: var(--white);
      transform: translateX(10px);
    }
    .value-swap:hover .value-default{
      opacity: 0;
    }
    .value-swap:hover .value-hover{
      opacity: 1;
    }
  }
   @media (hover: none){
    .contact-row .value,
    .contact-row .value .value-default,
    .contact-row .value .value-hover,
    a.value:active,
    .contact-row .value.is-static:active{
      color: #ffffff !important;
    }
    .value-swap:active .value-default{
      opacity: 0;
    }
    .value-swap:active .value-hover{
      opacity: 1;
    }
    .value-swap.is-email .value-default{
      opacity: 0;
    }
    .value-swap.is-email .value-hover{
      opacity: 1;
    }
  }

   @media (max-width: 700px){
    html, body{ height: 100%; }
    body{ min-height: 100svh; display: flex; flex-direction: column; }
    site-header, site-menu{ flex: 0 0 auto; }
    main{ flex: 1 0 auto; min-height: 0; display: flex; flex-direction: column; padding-top: calc(var(--header-h, 140px) + 8px); }
    .page-head{ padding: 0 20px 48px; }
    .contact{ flex: 0 0 auto; padding: 0 20px 24px; display: flex; flex-direction: column; }
    .contact-row:first-child{ padding-top: 28px; }
    .contact-row{ flex-direction: column; gap: 12px; padding: 28px 0; }
    .contact-row .label{ flex: 0 0 auto; padding-top: 0; }
    .contact-row .value{ font-size: clamp(1.5rem, 6.5vw, 1.9rem); }
    site-footer{ flex: 1 0 auto; display: flex; flex-direction: column; justify-content: flex-end; margin-top: 0; }
  }

  /* Tablet */
  @media (min-width: 701px) and (max-width: 900px){
    .page-head{ padding: 0 28px 40px; }
    .contact{ padding: 34px 28px 70px; }
    .contact-row .label{ flex: 0 0 130px; }
  }
</style>
</head>
<body data-page="contacto">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.contacto.heading"></h1>
  </section>
  <section class="contact">
    <article class="contact-row">
      <a class="value value-swap is-email" href="mailto:" data-href="shared.mailtoEmail">
        <span class="value-default" data-text="pages.contacto.labels.email"></span>
        <span class="value-hover" data-text="shared.email"></span>
      </a>
    </article>
    <article class="contact-row">
      <a class="value value-swap" href="#" data-href="shared.instagramUrl" target="_blank" rel="noopener">
        <span class="value-default" data-text="pages.contacto.labels.instagram"></span>
        <span class="value-hover" data-text="shared.instagramHandle"></span>
      </a>
    </article>
    <article class="contact-row">
      <a class="value value-swap" href="#" data-href="shared.youtubeUrl" target="_blank" rel="noopener">
        <span class="value-default" data-text="pages.contacto.labels.youtube"></span>
        <span class="value-hover" data-text="shared.youtubeHandle"></span>
      </a>
    </article>
    <article class="contact-row">
      <a class="value value-swap" href="#" data-href="shared.tiktokUrl" target="_blank" rel="noopener">
        <span class="value-default" data-text="pages.contacto.labels.tiktok"></span>
        <span class="value-hover" data-text="shared.tiktokHandle"></span>
      </a>
    </article>
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.location"></div>
      <div class="value is-static" data-text="shared.location"></div>
    </article>
  </section>
</main>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
