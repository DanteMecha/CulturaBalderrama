<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --celeste: #9EC5EC;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: calc(var(--header-h, 140px) + 8px); }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  /* ---------- contacto ---------- */
  .contact{
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 40px 90px;
  }
  .contact-row{
    display: flex;
    gap: 28px;
    padding: 40px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .contact-row:last-child{
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .contact-row .label{
    flex: 0 0 150px;
    padding-top: 8px;
    font-family: var(--font-body);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 0.72rem;
    color: var(--celeste);
  }
  .contact-row .value{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(1.8rem, 4.5vw, 3.2rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--dim);
    transition: color 0.3s ease, transform 0.4s ease;
  }
  a.value{ display: inline-block; }
  a.value:focus-visible{
    color: var(--white);
    transform: translateX(10px);
  }
  /* El hover solo con cursor real: en touch queda pegado tras el tap. */
  @media (hover: hover) and (pointer: fine){
    a.value:hover,
    .contact-row .value.is-static:hover{
      color: var(--white);
      transform: translateX(10px);
    }
  }
  @media (hover: none){
    a.value:active,
    .contact-row .value.is-static:active{
      color: var(--white);
      transform: translateX(10px);
    }
  }

  @media (max-width: 700px){
    .page-head{ padding: 0 20px 20px; }
    .contact{ padding: 0 20px 60px; }
    .contact-row{ flex-direction: column; gap: 12px; padding: 28px 0; }
    /* En columna el flex-basis pasa a ser alto: sin esto el label se estira a 150px. */
    .contact-row .label{ flex: 0 0 auto; padding-top: 0; }
    .contact-row .value{ font-size: clamp(1.5rem, 6.5vw, 1.9rem); }
  }

  /* Tablet */
  @media (min-width: 701px) and (max-width: 900px){
    .page-head{ padding: 0 28px 40px; }
    .contact{ padding: 34px 28px 70px; }
    .contact-row .label{ flex: 0 0 130px; }
  }
</style>
</head>
<body data-page="contacto">

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1 data-text="pages.contacto.heading"></h1>
  </section>
  <section class="contact">
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.email"></div>
      <a class="value" href="mailto:" data-text="shared.email" data-href="shared.mailtoEmail"></a>
    </article>
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.instagram"></div>
      <a class="value" href="#" data-text="shared.instagramHandle" data-href="shared.instagramUrl" target="_blank" rel="noopener"></a>
    </article>
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.youtube"></div>
      <a class="value" href="#" data-text="shared.youtubeHandle" data-href="shared.youtubeUrl" target="_blank" rel="noopener"></a>
    </article>
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.tiktok"></div>
      <a class="value" href="#" data-text="shared.tiktokHandle" data-href="shared.tiktokUrl" target="_blank" rel="noopener"></a>
    </article>
    <article class="contact-row">
      <div class="label" data-text="pages.contacto.labels.location"></div>
      <div class="value is-static" data-text="shared.location"></div>
    </article>
  </section>
</main>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
