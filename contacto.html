<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — Balderrama</title>
<link rel="stylesheet" href="tipografias.css">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: 140px; }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  .contact{
    padding: 0 40px 80px;
    max-width: 720px;
    margin: 0 auto;
  }
  .contact a{
    display: block;
    font-family: var(--font-title);
    font-size: clamp(1.6rem, 4vw, 3rem);
    margin-bottom: 16px;
    transition: color 0.25s ease;
  }
  .contact a:hover{ color: var(--dim); }

  @media (max-width: 700px){
    .page-head{ padding: 0 20px 40px; }
    .contact{ padding: 0 20px 60px; }
  }
</style>
</head>
<body>

<site-header href="index.html"></site-header>
<site-menu></site-menu>

<main>
  <section class="page-head">
    <h1>Contacto</h1>
  </section>
  <section class="contact">
    <a href="mailto:info@estudio.com">info@estudio.com</a>
    <a href="https://www.instagram.com/culturabalderrama/" target="_blank" rel="noopener">@culturabalderrama</a>
    <span style="color: var(--dim); font-size: 0.9rem; letter-spacing: 1.5px;">Buenos Aires, Argentina</span>
  </section>
</main>

<site-footer></site-footer>

<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

</body>
</html>
