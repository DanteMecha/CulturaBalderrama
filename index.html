<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }
  /* El hero mide 100vw para cubrir la barra de scroll: se recorta el desborde
     lateral. `clip` (y no `hidden`) no crea un contenedor de scroll, asi que no
     afecta al header, al menu ni a 100svh. */
  html{ overflow-x: clip; }

  a{ color: inherit; text-decoration: none; }

  /* ---------- hero ---------- */
  /* El fondo se mide contra 100vw y no contra el ancho del contenido: asi la
     barra de scroll vertical no deja una franja negra del lado derecho. */
  .hero-bg,
  .featured-media{
    width: 100vw;
    left: 50%;
    transform: translateX(-50%);
  }
  .hero{
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: calc(var(--header-h, 100px) + 28px) 40px 60px;
    position: relative;
  }
  .hero-bg{
    position: absolute;
    top: 0;
    bottom: 0;
    background: #000000 url('images/Contenido_Marttein_1.jpeg') center/cover no-repeat;
    opacity: 0.85;
  }
  .hero-bg::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
  }
  /* ---------- featured titles ---------- */
  .featured{
    position: relative;
    z-index: 2;
    margin-top: 0;
  }
  .featured-media{
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  .featured-media img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.05);
    transition: opacity 0.5s ease, transform 1.2s ease;
  }
  .featured-media img.is-active{
    opacity: 1;
    transform: scale(1);
  }
  .featured-media::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.45) 100%);
  }
  .featured-titles{
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
    min-height: 0;
  }
  .featured-titles a{
    display: block;
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.2rem, 5.5vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--dim);
    transition: color 0.3s ease, transform 0.4s ease;
  }
  .featured-titles li.is-active a,
  .featured-titles a:focus-visible{
    color: var(--white);
    transform: translateX(10px);
  }
  .featured-titles a:focus-visible{
    color: #B3D4FF;
  }
  /* El hover solo en dispositivos con cursor real: en touch queda pegado
     despues del tap. El feedback de toque va por :active. */
  @media (hover: hover) and (pointer: fine){
    .featured-titles a:hover{
      color: var(--white);
      transform: translateX(10px);
    }
  }
  @media (hover: none){
    .featured-titles a:active{
      color: var(--white);
      transform: translateX(10px);
    }
  }

  /* ---------- about ---------- */
  .about{
    padding: 160px 40px;
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
  }
  .about h2{
    font-family: var(--font-title);
    font-weight: 400;
    font-size: 1.6rem;
    margin-bottom: 28px;
    color: var(--dim);
  }
  .about p{
    font-size: 1.05rem;
    line-height: 1.75;
    font-weight: 300;
    color: var(--white);
  }

  @media (max-width: 700px){
    /* En vertical la foto de escritorio recorta mal: va una sola para celular. */
    .hero-bg{
      background-image: url('images/Inicio_background_phone.jpg');
    }
    .hero{ padding: calc(var(--header-h, 100px) + 24px) 20px 40px; }
    .featured-titles a{ font-size: clamp(2rem, 11vw, 3rem); }
    .about{ padding: 72px 20px; }
    /* En vertical los titulos se apoyan abajo: el velo tiene que ir vertical. */
    .featured-media::after{
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
    }
  }

  /* Tablet: titulos mas chicos para que respiren. */
  @media (min-width: 701px) and (max-width: 900px){
    .hero{ padding: calc(var(--header-h, 100px) + 24px) 28px 48px; }
    .featured-titles a{ font-size: clamp(2.2rem, 7vw, 3.6rem); }
    .about{ padding: 96px 28px; }
  }

  /* Celular apaisado: entra muy poco alto, asi que todo se achica. */
  @media (max-height: 500px) and (orientation: landscape){
    .hero{ padding: calc(var(--header-h, 90px) + 16px) 24px 28px; }
    .featured-titles a{ font-size: clamp(1.6rem, 6vw, 2.4rem); }
    .about{ padding: 56px 24px; }
    .about h2{ font-size: 1.3rem; margin-bottom: 18px; }
  }
</style>
</head>
<body data-page="home">

<site-header href="#"></site-header>
<site-menu></site-menu>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="featured-media">
    <img src="images/Contenido_Lucrecia_6.jpeg" alt="">
    <img src="images/Contenido_Marttein_4.jpeg" alt="">
  </div>

  <section class="featured" id="destacados">
    <ul class="featured-titles">
      <li><a href="eventos.html#lucrecia-martel">Lucrecia Martel</a></li>
      <li><a href="eventos.html#marttein">Marttein</a></li>
    </ul>
  </section>
</section>

<section class="about" id="about">
  <h2 data-text="pages.home.aboutTitle"></h2>
  <p data-text="pages.home.aboutText"></p>
</section>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

<script>
(function () {
  'use strict';

  var hero = document.querySelector('.hero');
  var list = hero && hero.querySelector('.featured-titles');
  if (!list) return;

  // Los nombres son links a eventos.html: en touch el tap navega, asi que no hay
  // momento de mostrar el swap. En esos dispositivos el hero queda con .hero-bg.
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  var items = list.querySelectorAll('li');
  var slides = hero.querySelectorAll('.featured-media img');

  function show(i) {
    slides.forEach(function (slide, n) { slide.classList.toggle('is-active', n === i); });
    items.forEach(function (item, n) { item.classList.toggle('is-active', n === i); });
  }

  items.forEach(function (item, i) {
    item.addEventListener('pointerenter', function () { show(i); });
    item.addEventListener('pointerleave', function () { show(-1); });
    item.querySelector('a').addEventListener('focus', function () { show(i); });
  });

  list.addEventListener('focusout', function (ev) {
    if (!list.contains(ev.relatedTarget)) show(-1);
  });
})();
</script>

</body>
</html>
