<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- hero ---------- */
  .hero{
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: calc(var(--header-h, 100px) + 28px) 40px 60px;
    position: relative;
  }
  .hero-bg{
    position: absolute;
    inset: 0;
    background: #000000 url('PLACEHOLDER_HERO_IMAGE.jpg') center/cover no-repeat;
    opacity: 0.85;
  }
  .hero-bg::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
  }
  /* ---------- logo / h1 ---------- */
  .logo-hero{
    position: relative;
    z-index: 2;
    color: #B3D4FF;
    font-family: var(--font-brand);
    text-transform: uppercase;
    font-size: clamp(8vw, 8vw, 8vw);
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-align: left;
    user-select: none;
  }
  .logo-hero.pinned{
    position: fixed;
    z-index: 20;
  }

  /* ---------- featured titles ---------- */
  .featured{
    position: relative;
    z-index: 2;
    margin-top: 260px;
  }
  .featured-media{
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  .featured-media img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.05);
    transition: opacity 0.5s ease, transform 1.2s ease;
  }
  .featured-media img.is-active{
    opacity: 1;
    transform: scale(1);
  }
  .featured-media::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.45) 100%);
  }
  .featured-titles{
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
    min-height: 42vh;
  }
  .featured-titles a{
    display: block;
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.2rem, 5.5vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--dim);
    transition: color 0.3s ease, transform 0.4s ease;
  }
  .featured-titles li.is-active a,
  .featured-titles a:hover,
  .featured-titles a:focus-visible{
    color: var(--white);
    transform: translateX(10px);
  }
  .featured-titles a:focus-visible{
    color: #B3D4FF;
  }

  /* ---------- projects grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gutter);
    background: var(--black);
  }
  .grid.wide{
    grid-template-columns: repeat(3, 1fr);
  }

  .cell{
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0a0a0a;
    cursor: pointer;
  }
  .cell.banner1{
    grid-column: 1 / -1;
    aspect-ratio: 4160/2612;
    cursor: default;
  }
  .cell.banner1 img{
    filter: none;
  }
  .cell.banner1:hover img{
    transform: none;
    filter: none;
  }
  .cell img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%);
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  .cell:hover img{
    transform: scale(1.03);
    filter: grayscale(0%);
  }
  .cell .caption{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .cell:hover .caption{
    opacity: 1;
    transform: translateY(0);
  }
  .caption .title{
    font-weight: 500;
    font-size: 1rem;
  }
  .caption .sub{
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--dim);
    margin-top: 2px;
  }

  /* ---------- about ---------- */
  .about{
    padding: 160px 40px;
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
  }
  .about h2{
    font-family: var(--font-title);
    font-weight: 400;
    font-size: 1.6rem;
    margin-bottom: 28px;
    color: var(--dim);
  }
  .about p{
    font-size: 1.05rem;
    line-height: 1.75;
    font-weight: 300;
    color: var(--white);
  }

  @media (max-width: 700px){
    .grid, .grid.wide{ grid-template-columns: 1fr; }
    .hero{ padding: calc(var(--header-h, 100px) + 24px) 20px 40px; }
    .featured-titles a{ font-size: clamp(2rem, 11vw, 3rem); }
  }
</style>
</head>
<body data-page="home">

<site-header href="#"></site-header>
<site-menu></site-menu>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="featured-media">
    <img src="images/contenido_Lucrecia_Martel_1.jpg" alt="">
    <img src="images/contenido_Marttein_3.jpg" alt="">
  </div>
  <h1 class="logo-hero" data-text="pages.home.heroTitle"></h1>

  <section class="featured" id="destacados">
    <ul class="featured-titles">
      <li><a href="eventos.html#lucrecia-martel">Lucrecia Martel</a></li>
      <li><a href="eventos.html#marttein">Marttein</a></li>
    </ul>
  </section>
</section>

<section class="grid" id="work">
  <div class="cell banner1">
    <img src="images/Banner_1.jpeg" alt="">
  </div>
</section>

<section class="about" id="about">
  <h2 data-text="pages.home.aboutTitle"></h2>
  <p data-text="pages.home.aboutText"></p>
</section>

<site-footer></site-footer>

<script src="texts/texts.js"></script>
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>

<script>
(function () {
  'use strict';

  var logo = document.querySelector('.logo-hero');
  if (!logo) return;

  var header = document.querySelector('site-header');
  var pinned = false;
  var startTop = null;
  var topOffset = header ? header.getBoundingClientRect().bottom : 80;

  function syncHeaderHeight() {
    if (!header) return;
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }

  syncHeaderHeight();

  function measure() {
    if (pinned) return;
    startTop = logo.offsetTop;
    if (startTop == null || startTop <= 0) return;
    topOffset = header ? header.getBoundingClientRect().bottom : 80;
    var left = getComputedStyle(logo.parentElement).paddingLeft;
    logo.dataset.left = left;
  }

  function update() {
    if (startTop == null) measure();
    if (startTop == null) return;
    var pinFrom = startTop - topOffset;
    if (window.scrollY >= pinFrom) {
      if (!pinned) {
        logo.classList.add('pinned');
        logo.style.top = topOffset + 'px';
        logo.style.left = logo.dataset.left;
        pinned = true;
      }
    } else if (pinned) {
      logo.classList.remove('pinned');
      logo.style.cssText = '';
      pinned = false;
      startTop = null;
      measure();
    }
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', function () {
    syncHeaderHeight();
    startTop = null;
    update();
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      startTop = null;
      update();
    });
  }
  update();
})();
</script>

<script>
(function () {
  'use strict';

  var hero = document.querySelector('.hero');
  var list = hero && hero.querySelector('.featured-titles');
  if (!list) return;

  var items = list.querySelectorAll('li');
  var slides = hero.querySelectorAll('.featured-media img');

  function show(i) {
    slides.forEach(function (slide, n) { slide.classList.toggle('is-active', n === i); });
    items.forEach(function (item, n) { item.classList.toggle('is-active', n === i); });
  }

  items.forEach(function (item, i) {
    item.addEventListener('mouseenter', function () { show(i); });
    item.addEventListener('mouseleave', function () { show(-1); });
    item.querySelector('a').addEventListener('focus', function () { show(i); });
  });

  list.addEventListener('focusout', function (ev) {
    if (!list.contains(ev.relatedTarget)) show(-1);
  });
})();
</script>

</body>
</html>
