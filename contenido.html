<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="texts/tipografias.css">

<style>
  :root{
    --black: #000000;
    --white: #f5f5f5;
    --dim: #6b6b6b;
    --gutter: 2px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
  }

  a{ color: inherit; text-decoration: none; }

  main{ padding-top: 140px; }
  .page-head{
    padding: 0 40px 50px;
  }
  .page-head h1{
    font-family: var(--font-title);
    text-transform: uppercase;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gutter);
  }
  .grid.wide{
    grid-template-columns: repeat(3, 1fr);
  }
  .cell{
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0a0a0a;
    cursor: pointer;
    content-visibility: auto;
    contain-intrinsic-size: auto 100%;
  }
  .cell img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }
  .cell::after{
    content: '';
    position: absolute;
    inset: 0;
    background: #808080;
    mix-blend-mode: saturation;
    opacity: 0.15;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .cell:hover img{
    transform: scale(1.03);
  }
  .cell:hover::after{
    opacity: 0;
  }
  .cell .caption{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%);
  }
  .caption .title{ font-weight: 500; font-size: 1rem; }
  .caption .sub{
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--dim);
    margin-top: 2px;
  }

  site-footer{ display: block; margin-top: 80px; }

  body.viewer-open{ overflow: hidden; }

  .viewer{
    position: fixed;
    inset: 0;
    z-index: 70;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .viewer.open{
    opacity: 1;
    pointer-events: auto;
  }
  .viewer .stage{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 60px 100px;
    margin: 0;
  }
  .viewer .stage img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .viewer .nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 50%;
    color: var(--white);
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.25s ease, border-color 0.25s ease;
  }
  .viewer .nav:hover{ opacity: 1; border-color: rgba(255,255,255,0.5); }
  .viewer .nav.prev{ left: 24px; }
  .viewer .nav.next{ right: 24px; }
  .viewer .nav svg{
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .viewer .close{
    position: absolute;
    top: 22px;
    right: 24px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--white);
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.25s ease;
  }
  .viewer .close:hover{ opacity: 1; }
  .viewer .close svg{
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
  }
  .viewer .count{
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    letter-spacing: 2px;
    color: var(--dim);
  }

  @media (max-width: 700px){
    .grid, .grid.wide{ grid-template-columns: 1fr; }
    .page-head{ padding: 0 20px 40px; }
    .viewer .stage{ padding: 56px 20px; }
    .viewer .nav{ width: 42px; height: 42px; border-color: transparent; opacity: 0.6; }
    .viewer .nav.prev{ left: 6px; }
    .viewer .nav.next{ right: 6px; }
  }
</style>
</head>

<div class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="close" id="viewerClose" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="nav prev" id="viewerPrev" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <figure class="stage"><img id="viewerImg" src="" alt=""></figure>
  <button class="nav next" id="viewerNext" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <span class="count" id="viewerCount"></span>

<script src="texts/texts.js"></script>  
<script src="texts/apply-texts.js"></script>
<script src="components/site-header.js"></script>
<script src="components/site-menu.js"></script>
<script src="components/site-footer.js"></script>
<script>
  const TEXTS = window.TEXTS || {};
  const VIEWER = (TEXTS.pages && TEXTS.pages.contenido) || {};
  const MAX_CACHED = 1;

  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const viewerPrev = document.getElementById('viewerPrev');
  const viewerNext = document.getElementById('viewerNext');
  const viewerClose = document.getElementById('viewerClose');
  const viewerCount = document.getElementById('viewerCount');
  const viewerStage = viewer.querySelector('.stage');
  const cells = Array.from(document.querySelectorAll('#work .cell'));

  const photos = cells.map(cell => {
    const img = cell.querySelector('img');
    return { thumb: img.getAttribute('src'), full: img.getAttribute('data-full') || img.getAttribute('src') };
  });

  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 1500));

  let index = 0;
  let seq = 0;
  let touchX = null;

  viewerPrev.setAttribute('aria-label', VIEWER.viewerPrevLabel || 'Anterior');
  viewerNext.setAttribute('aria-label', VIEWER.viewerNextLabel || 'Siguiente');
  viewerClose.setAttribute('aria-label', VIEWER.viewerCloseLabel || 'Cerrar');

  // Los originales llegan a 24 MP (96 MB decodificados cada uno). Por eso solo se
  // decodifica la foto visible y las vecinas solo calientan el cache HTTP: asi no
  // quedan bitmaps gigantes en memoria ni decodificaciones en el main thread.
  const decoded = new Map();
  const warming = new Set();

  const warm = src => {
    if (warming.has(src)) return;
    warming.add(src);
    const im = new Image();
    im.decoding = 'async';
    im.onload = im.onerror = () => warming.delete(src);
    im.src = src;
  };

  const fullPhoto = src => {
    const cached = decoded.get(src);
    if (cached) {
      decoded.delete(src);
      decoded.set(src, cached);
      return cached;
    }
    const im = new Image();
    im.decoding = 'async';
    im.src = src;
    const ready = im.decode
      ? im.decode().then(() => true, () => false)
      : new Promise(res => { im.onload = () => res(true); im.onerror = () => res(false); });
    decoded.set(src, ready);
    while (decoded.size > MAX_CACHED) decoded.delete(decoded.keys().next().value);
    return ready;
  };

  const prefetch = i => {
    const photo = photos[(i + photos.length) % photos.length];
    if (photo) warm(photo.full);
  };

  const show = i => {
    index = i;
    const token = ++seq;
    const photo = photos[i];

    // Thumbnail primero (ya esta en cache: pinta al instante) y original despues:
    // la foto aparece de una en el centro, sin transiciones.
    viewerImg.src = photo.thumb;
    viewerCount.textContent = (i + 1) + ' ' + (VIEWER.viewerOfLabel || 'de') + ' ' + photos.length;

    fullPhoto(photo.full).then(ok => {
      if (token !== seq || !ok) return;
      viewerImg.src = photo.full;
    });

    prefetch(i + 1);
    prefetch(i - 1);
    idle(() => { prefetch(index + 2); prefetch(index - 2); });
  };

  const open = i => {
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('viewer-open');
    show(i);
  };

  const close = () => {
    seq++;
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewer-open');
    viewerImg.removeAttribute('src');
  };

  const go = dir => show((index + dir + photos.length) % photos.length);

  cells.forEach((cell, i) => {
    cell.addEventListener('click', () => open(i));
  });

  viewerPrev.addEventListener('click', () => go(-1));
  viewerNext.addEventListener('click', () => go(1));
  viewerClose.addEventListener('click', close);
  viewer.addEventListener('click', e => {
    if (e.target === viewer || e.target === viewerStage) close();
  });
  viewer.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  viewer.addEventListener('touchend', e => {
    if (touchX === null) return;
    const delta = e.changedTouches[0].clientX - touchX;
    if (Math.abs(delta) > 40) go(delta < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });
</script>

</body>
</html>
